# =============================================================
#  momiji-stack — MomijiStore OS Docker Compose 定義
# =============================================================
#  正本: GitHub (houzyou777-creator/inventory-management)
#  実行: UGREEN NAS (UGOS Container Manager) の Project として配置
#
#  このファイル1つで会社のインフラを再現できる状態を目指す。
#  NAS故障時も、新しい機材とこのファイルから復元する。
#
#  【Phase3 STEP4 時点の状態】
#  momiji-postgres と momiji-mcp を定義済み。
#  Python Worker は STEP5 以降(雛形をコメントで用意)。

#
#  【命名規則】Architecture.md Naming Convention 準拠
#    サービス/コンテナ : momiji-<name>   (小文字ケバブケース)
#    ボリューム/NW     : momiji_<name>   (スネークケース)
#    環境変数          : MOMIJI_<NAME>   (大文字スネークケース)
#    イメージ          : バージョンタグを固定(latest 禁止)
#
#  【制約】RAM 8GB (NAS本体と共有)
#    常駐は momiji-postgres と momiji-mcp の2つのみ。
#    それ以外はジョブ実行型(常駐させない)。
#    メモリ配分の実測値は STEP3 で確定する (Plan OQ-6)。
# =============================================================

name: momiji-stack

# -------------------------------------------------------------
#  ネットワーク — スタック内部の通信のみ。外部公開しない。
#  ※ deploy するまで実体は作られない
# -------------------------------------------------------------
networks:
  momiji_net:
    name: momiji_net
    driver: bridge

# -------------------------------------------------------------
#  ボリューム — 永続データの置き場
#  配置: SSD ボリューム1 (RAID1 / Btrfs) = 業務データ正本領域
#  ※ deploy するまで実体は作られない
# -------------------------------------------------------------
volumes:
  momiji_pg_data:
    name: momiji_pg_data

# -------------------------------------------------------------
#  サービス
# -------------------------------------------------------------
services:

  # --- STEP3: PostgreSQL ---
  #  Phase4(Excel→DB移行)の受け皿。
  #  ⚠️ Phase4完了までDB上のデータは一切「正本」ではない。
  #     この期間にDBを参照して業務判断してはならない (Plan §6)。
  momiji-postgres:
    image: postgres:16.14-alpine
    container_name: momiji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOMIJI_DB_NAME}
      POSTGRES_USER: ${MOMIJI_DB_USER}
      POSTGRES_PASSWORD: ${MOMIJI_DB_PASSWORD}
      TZ: ${MOMIJI_TZ}
    volumes:
      - momiji_pg_data:/var/lib/postgresql/data
    networks:
      - momiji_net
    # RAM 8GB制約。STEP3-1の実測後に調整する (Plan OQ-6)
    mem_limit: 1g
    healthcheck:
      # POSTGRES_USER はコンテナ内の環境変数。$$ でCompose展開を避ける
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # ports は開けない。スタック内部からのみ接続する(外部公開しない)

  # --- STEP4 / STEP5-1: MCP Server ---
  #  公式SDK(mcp)の標準サーバー。streamable-http を待ち受ける。
  #  tool: health_check(STEP4)/ search_products(STEP5-1・読み取り専用)
  momiji-mcp:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
      # ビルド中の RUN はDockerデーモンのDNS設定を継承するため、
      # NAS側のDNSが引き継がれず pip install が名前解決に失敗する。
      # host ネットワークを使ってホストの名前解決をそのまま利用する。
      network: host
    container_name: momiji-mcp
    restart: unless-stopped

    # NASのLAN側IPにバインドし、全インターフェースへの公開を避ける。
    # /mcp 配下は Bearer トークン必須(STEP5-2)。/health のみ認証不要。
    ports:
      - "192.168.0.8:8000:8000"

    # 商品マスターのスナップショットを読み取り専用でマウントする。
    # ⚠️ これは正本ではない。正本は Mac側 SourceData/商品マスター_単品_v1.0.xlsx。
    volumes:
      - ./data/products:/app/data/products:ro

    environment:
      MOMIJI_DB_HOST: momiji-postgres
      MOMIJI_DB_PORT: "5432"
      MOMIJI_DB_NAME: ${MOMIJI_DB_NAME}
      MOMIJI_DB_USER: ${MOMIJI_DB_USER}
      MOMIJI_DB_PASSWORD: ${MOMIJI_DB_PASSWORD}
      TZ: ${MOMIJI_TZ}
      # 検索結果の返却件数(未設定なら 50 / 500)
      MOMIJI_DEFAULT_LIMIT: ${MOMIJI_DEFAULT_LIMIT:-50}
      MOMIJI_MAX_LIMIT: ${MOMIJI_MAX_LIMIT:-500}
      # Bearer認証トークン。既定値を置かない = 未設定なら起動時に失敗させる。
      # 値は .env にのみ置き、リポジトリには絶対に含めない(CHARTER §4)。
      MOMIJI_API_KEY: ${MOMIJI_API_KEY:?MOMIJI_API_KEY を .env に設定してください}
    depends_on:
      momiji-postgres:
        condition: service_healthy
    networks:
      - momiji_net
    mem_limit: 512m
    healthcheck:
      # /health は認証不要のため、APIキーなしで死活監視できる(STEP5-2で実装)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

# =============================================================
#  以下は STEP5 以降で有効化する雛形(現在は無効)
# =============================================================
#
#  --- STEP5: Python Worker (ジョブ型・常駐しない) --------------
#  ⚠️ 現行スクリプトは macOS + Microsoft Excel 依存のため
#     Linux コンテナでは実行できない (Plan §8)。
#     実処理の移行は Phase4 (DB移行) 以降。
